name: Build AI routing module

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "sources/**"
      - "scripts/build_module.py"
      - "scripts/fetch_sources.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: ai-routing-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh review-only upstream candidates
        run: python scripts/fetch_sources.py
      - name: Build curated module and report
        run: python scripts/build_module.py
      - name: Validate deterministic output
        run: python scripts/build_module.py --check
      - name: Commit only changed generated artifacts
        run: |
          if git diff --quiet -- modules/phase2-group-test.module reports/build.json sources/candidates.txt reports/upstream.json && [ -z "$(git ls-files --others --exclude-standard -- reports/build.json reports/upstream.json)" ]; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/phase2-group-test.module reports/build.json sources/candidates.txt reports/upstream.json
          git commit -m "chore: refresh curated AI routing module"
          git push
